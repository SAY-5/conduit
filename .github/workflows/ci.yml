name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_DEFAULT_REGION: us-east-1

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run selfcheck

  python:
    runs-on: ubuntu-latest
    services:
      localstack:
        image: localstack/localstack:3.8
        ports:
          - 4566:4566
        env:
          SERVICES: sqs,dynamodb,iam,ssm,sts
          EAGER_SERVICE_LOADING: "1"
          SQS_ENDPOINT_STRATEGY: standard
        options: >-
          --health-cmd "curl -fsS http://localhost:4566/_localstack/health"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.7"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-extras --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest tests/unit -q --cov=conduit --cov-report=term-missing:skip-covered --cov-fail-under=85
      - run: uv run pytest tests/integration -q
        env:
          CONDUIT_LOCALSTACK_URL: http://localhost:4566

  terraform:
    runs-on: ubuntu-latest
    services:
      localstack:
        image: localstack/localstack:3.8
        ports:
          - 4566:4566
        env:
          SERVICES: sqs,dynamodb,iam,ssm,sts
          SQS_ENDPOINT_STRATEGY: standard
        options: >-
          --health-cmd "curl -fsS http://localhost:4566/_localstack/health"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 40
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"
          terraform_wrapper: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.7"
      - run: terraform -chdir=terraform fmt -check -recursive
      - run: terraform -chdir=terraform init -input=false
      - run: terraform -chdir=terraform validate
      - run: terraform -chdir=terraform plan -input=false -var-file=localstack.tfvars -state=ci.tfstate
      - run: terraform -chdir=terraform apply -input=false -auto-approve -var-file=localstack.tfvars -state=ci.tfstate
      - run: uv sync --all-extras --frozen
      - run: uv run pytest tests/terraform -q

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: conduit:ci
