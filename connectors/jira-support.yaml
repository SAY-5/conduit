# Create or update an issue in the SUP project for every task revision.
type: jira
target: SUP
base_url: ${JIRA_BASE_URL:-https://example.atlassian.net}
secrets:
  email: JIRA_EMAIL
  api_token: JIRA_API_TOKEN
mapping:
  summary:
    source: title
    type: string
    required: true
    max_length: 255                # Jira's summary limit; longer titles are cut
  description: body
  issuetype:
    default: Task                  # constant: no source, only a default
  customfield_10042:
    source: id                     # external task id field
    required: true
retry:
  max_attempts: 4
  base_seconds: 0.25
  max_seconds: 8
rate_limit:
  requests_per_second: 10
queue:
  max_receive_count: 3
  visibility_timeout_seconds: 45
idempotency_ttl_seconds: 1209600
