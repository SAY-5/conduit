# Post every task to the #ops channel as a Block Kit message.
type: slack
target: "#ops"
base_url: ${SLACK_BASE_URL:-https://slack.com}   # the demo points this at a fake
secrets:
  token: SLACK_BOT_TOKEN
mapping:
  title:
    source: "[$priority] $title"
    max_length: 150                # Slack header block limit
  body: body
retry:
  max_attempts: 5
  base_seconds: 0.2
  max_seconds: 5
rate_limit:
  requests_per_second: 20
  burst: 5
breaker:
  failure_threshold: 5
  recovery_seconds: 20
queue:
  max_receive_count: 3
  visibility_timeout_seconds: 30
